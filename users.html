<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>משתמשים והרשאות · ידידיה מוטורס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="boot" id="boot">
  <div class="mark">YEDIDIA MOTORS</div>
  <div class="spinner"></div>
  <div class="msg">טוען…</div>
</div>

<div class="shell" id="shell" hidden>

  <aside class="aside">
    <div class="logo"><img src="design/assets/logo.png" alt="ידידיה מוטורס"></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-foot">
      <div id="side-box"></div>
      <div class="tagline">FOR PEOPLE WHO LOVE THE LIFE</div>
      <button class="signout" type="button" id="signout">יציאה מהחשבון</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="who">
        <div class="eyebrow">ניהול המערכת</div>
        <h1 class="greeting">משתמשים והרשאות</h1>
        <div class="meta-line" id="meta-line"></div>
      </div>
      <div class="tools">
        <button class="btn-primary" type="button" id="add-user">הוספת משתמש</button>
        <div class="avatar" id="avatar">—</div>
      </div>
    </header>

    <div id="notice"></div>

    <div class="tabs" role="tablist">
      <button class="tab is-active" type="button" data-tab="users" role="tab">משתמשים</button>
      <button class="tab" type="button" data-tab="perms" role="tab">הרשאות לפי תפקיד</button>
    </div>

    <!-- משתמשים -->
    <section id="panel-users">
      <div id="lockouts"></div>
      <div class="card">
        <div class="thead users-grid">
          <div>שם</div><div>טלפון</div><div>מייל</div><div>תפקיד</div>
          <div>סטטוס</div><div>הרשאות</div><div>כניסה אחרונה</div><div></div>
        </div>
        <div id="user-rows"></div>
      </div>
    </section>

    <!-- הרשאות -->
    <section id="panel-perms" hidden>
      <div class="card">
        <div class="card-head">
          <h2>מטריצת הרשאות</h2>
          <span class="card-count" id="perm-count"></span>
        </div>
        <div class="matrix-scroll"><div id="matrix"></div></div>
        <div class="card-foot" id="perm-foot"></div>
      </div>
    </section>
  </main>
</div>

<!-- חלון עריכת משתמש -->
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">משתמש חדש</h2>
    <form id="user-form">
      <div class="field"><label for="f-name">שם מלא</label>
        <input id="f-name" type="text" required maxlength="60"></div>
      <div class="field"><label for="f-phone">טלפון</label>
        <input id="f-phone" type="tel" required placeholder="050-000-0000" dir="ltr"></div>
      <div class="field"><label for="f-email">מייל <span class="hint">(ערוץ גיבוי לקוד הכניסה)</span></label>
        <input id="f-email" type="email" placeholder="name@yedidia.co.il" dir="ltr"></div>
      <div class="field"><label for="f-role">תפקיד</label>
        <select id="f-role" required></select>
        <div class="hint" id="role-hint"></div></div>
      <div class="field"><label for="f-status">סטטוס</label>
        <select id="f-status">
          <option value="active">פעיל</option>
          <option value="suspended">מושהה</option>
        </select></div>
      <div class="msg err hidden" id="form-msg"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="modal-cancel">ביטול</button>
        <button type="submit" class="btn-primary" id="modal-save">שמירה</button>
      </div>
    </form>
    <div class="overrides" id="overrides-box" hidden>
      <h3>חריגות אישיות</h3>
      <p class="hint">הרשאה שמודלקת או מכובה למשתמש הזה בלבד, מעבר לתפקיד שלו.</p>
      <div id="overrides-list"></div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
