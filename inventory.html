<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מלאי רכבים · ידידיה מוטורס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="inventory.css">
</head>
<body>

<div class="boot" id="boot">
  <div class="mark">YEDIDIA MOTORS</div>
  <div class="spinner"></div>
  <div class="msg">טוען את המלאי…</div>
</div>

<div class="shell" id="shell" hidden>

  <aside class="aside">
    <div class="logo"><img src="design/assets/logo.png" alt="ידידיה מוטורס"></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-foot">
      <div id="side-box"></div>
      <div class="tagline">FOR PEOPLE WHO LOVE THE LIFE</div>
      <button class="signout" type="button" id="signout">יציאה מהחשבון</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="who">
        <div class="eyebrow" id="eyebrow">מלאי</div>
        <h1 class="greeting">מלאי רכבים</h1>
        <div class="meta-line" id="meta-line"></div>
      </div>
      <div class="tools">
        <div class="search">
          <span class="glass"></span>
          <input id="search" type="search" placeholder="VIN, דגם, צבע, מיקום או מספר הזמנה"
                 aria-label="חיפוש במלאי">
        </div>
        <div class="avatar" id="avatar">—</div>
      </div>
    </header>

    <div id="notice"></div>

    <div class="filter-bar">
      <div class="filter-group" id="status-filters" aria-label="סינון לפי סטטוס"></div>
      <div class="filter-group" id="make-filters" aria-label="סינון לפי יצרן"></div>
    </div>

    <div class="card">
      <div class="thead inv-grid">
        <div>רכב</div><div>דגם וגמר</div><div>שנה</div><div>מיקום</div>
        <div>ימים</div><div>מחיר</div><div>סטטוס</div>
      </div>
      <div id="rows"></div>
      <div class="card-foot" id="foot"></div>
    </div>

  </main>
</div>

<!-- כרטיס רכב -->
<div class="modal" id="modal" hidden>
  <div class="modal-box wide" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <button class="modal-x" type="button" id="card-close" aria-label="סגירה">×</button>
    <div id="card-body"><div class="empty">טוען…</div></div>
  </div>
</div>

<input type="file" id="file-input" hidden accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.xlsx">
<input type="file" id="photo-input" hidden multiple accept="image/*">

<script src="auth.js"></script>
<script src="inventory.js"></script>
</body>
</html>
