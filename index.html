<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>פאנל הצוות · ידידיה מוטורס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="boot" id="boot">
  <div class="mark">YEDIDIA MOTORS</div>
  <div class="spinner"></div>
  <div class="msg" id="boot-msg">טוען את הפאנל…</div>
</div>

<div class="shell" id="shell" hidden>

  <aside class="aside">
    <div class="logo"><img src="design/assets/logo.png" alt="ידידיה מוטורס · רכבי יוקרה · ביבוא מקביל"></div>

    <nav class="nav">
      <button class="nav-item is-active" type="button"><span class="dot"></span>סקירה כללית</button>
      <button class="nav-item is-soon" type="button" title="בבנייה"><span class="dot"></span>מלאי רכבים</button>
      <button class="nav-item is-soon" type="button" title="בבנייה"><span class="dot"></span>הזמנות בדרך</button>
      <button class="nav-item is-soon" type="button" title="בבנייה"><span class="dot"></span>לידים ולקוחות</button>
      <button class="nav-item is-soon" type="button" title="בבנייה"><span class="dot"></span>עסקאות ומימון</button>
      <button class="nav-item is-soon" type="button" title="בבנייה"><span class="dot"></span>מכולות ומכס</button>
      <button class="nav-item is-soon" type="button" title="בבנייה"><span class="dot"></span>דוחות</button>
    </nav>

    <div class="aside-foot">
      <div id="side-box"></div>
      <div class="tagline">FOR PEOPLE WHO LOVE THE LIFE</div>
      <button class="signout" type="button" id="signout">יציאה מהחשבון</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="who">
        <div class="eyebrow" id="eyebrow">סקירה כללית</div>
        <h1 class="greeting" id="greeting">שלום</h1>
        <div class="meta-line" id="meta-line"></div>
      </div>
      <div class="tools">
        <div class="search">
          <span class="glass"></span>
          <input id="search" type="search" placeholder="דגם, מספר שלדה או צבע" aria-label="חיפוש במלאי">
        </div>
        <button class="btn-primary" type="button" id="primary-action">רענון נתונים</button>
        <div class="avatar" id="avatar">—</div>
      </div>
    </header>

    <div id="notice"></div>

    <section class="hero">
      <div class="inner">
        <div class="title">מגוון מותגים, מגוון רכבים · יבואן אחד</div>
        <div class="brands">GMC · RAM · Mercedes-Benz · BMW · Chevrolet · Cadillac · Jeep · Ford</div>
        <div class="pills">
          <span>100% מימון</span>
          <span>אחריות ושירות</span>
          <span>שיטת שלם וסע</span>
        </div>
      </div>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="split">

      <div class="card">
        <div class="card-head">
          <h2 id="inventory-title">רכבים במלאי</h2>
          <div class="filters" id="filters"></div>
        </div>
        <div class="thead">
          <div>רכב</div><div>דגם וגמר</div><div>שנה</div><div>מחיר</div><div>ימים</div><div>סטטוס</div>
        </div>
        <div id="rows"></div>
        <div class="card-foot" id="inventory-foot"></div>
      </div>

      <div class="side-col" id="side-col"></div>

    </section>
  </main>
</div>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
