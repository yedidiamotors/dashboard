<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ספקים ותשלומים · ידידיה מוטורס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=20261023f">
<link rel="stylesheet" href="orders.css?v=20261023s">
<link rel="stylesheet" href="suppliers.css?v=20261023a">
<link rel="stylesheet" href="mobile.css?v=20261022c">
</head>
<body>

<div class="boot" id="boot">
  <div class="mark">YEDIDIA MOTORS</div>
  <div class="spinner"></div>
  <div class="msg">טוען ספקים…</div>
</div>

<div class="shell" id="shell" hidden>

  <aside class="aside">
    <div class="logo"><img src="design/assets/logo.png" alt="ידידיה מוטורס"></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-foot">
      <div id="side-box"></div>
      <div class="tagline">FOR PEOPLE WHO LOVE THE LIFE</div>
      <button class="signout" type="button" id="signout">יציאה מהחשבון</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="who">
        <div class="eyebrow" id="eyebrow">ספקים</div>
        <h1 class="greeting" id="page-title">ספקים ותשלומים</h1>
        <div class="meta-line" id="meta-line"></div>
      </div>
      <div class="tools">
        <form class="search" id="search-form" role="search">
          <span class="glass"></span>
          <input id="search" type="search" placeholder="שילדה (גם מבוטלת), אסמכתא, חשבונית, הערה לבנק או סכום" autocomplete="off" aria-label="חיפוש העברות ורכבים">
        </form>
        <button class="btn-ghost" type="button" id="new-transfer">העברה ידנית</button>
        <button class="btn-primary" type="button" id="upload-transfer">העלאת אישור העברה</button>
        <div class="avatar" id="avatar">—</div>
      </div>
    </header>

    <div id="notice"></div>
    <div id="search-results"></div>
    <div id="view"></div>

  </main>
</div>

<!-- חלון כללי: כל הטפסים נבנים לתוכו -->
<div class="modal" id="modal" hidden>
  <div class="modal-box sp-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-x" type="button" id="modal-close" aria-label="סגירה">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<input type="file" id="transfer-file" hidden accept=".pdf,.jpg,.jpeg,.png,.heic,.webp">

<script src="auth.js?v=20261026r"></script>
<script src="suppliers.js?v=20261023a"></script>
</body>
</html>
